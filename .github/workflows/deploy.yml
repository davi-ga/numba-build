name: LLM Refactor → Build → Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: tcc-matrix
  IMAGE: gcr.io/${{ vars.GCP_PROJECT_ID }}/tcc-matrix

jobs:
  refactor-build-deploy:
    name: Refactor, Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout Code
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Set up Python for the LLM inference step
      # ------------------------------------------------------------------ #
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------ #
      # 3. LLM Inference Step — run the intelligent compiler
      # ------------------------------------------------------------------ #
      - name: Run LLM refactoring (intelligent compiler)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT: ${{ secrets.REFACTOR_PROMPT }}
          SOURCE_DIR: sample_project
          OUTPUT_DIR: output_dir
        run: python refactor_script.py

      # ------------------------------------------------------------------ #
      # 4. Artifact Validation — ensure generated code is syntactically valid
      # ------------------------------------------------------------------ #
      - name: Validate generated artefacts (flake8)
        run: |
          pip install flake8
          flake8 output_dir/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503

      # ------------------------------------------------------------------ #
      # 5. Authenticate to Google Cloud
      # ------------------------------------------------------------------ #
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud credentials
        run: gcloud auth configure-docker --quiet

      # ------------------------------------------------------------------ #
      # 6. Containerisation — build image from optimised artefacts only
      # ------------------------------------------------------------------ #
      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            -f Dockerfile.optimized \
            .

      - name: Push Docker image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # ------------------------------------------------------------------ #
      # 7. Deploy to Cloud Run
      # ------------------------------------------------------------------ #
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --quiet
