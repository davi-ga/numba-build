steps:
  # ------------------------------------------------------------------ #
  # 1. Install Python dependencies for the refactoring step
  # ------------------------------------------------------------------ #
  - name: "python:3.12-slim"
    id: install-deps
    entrypoint: pip
    args:
      - "install"
      - "--no-cache-dir"
      - "-r"
      - "requirements.txt"

  # ------------------------------------------------------------------ #
  # 2. LLM Inference Step — run the intelligent compiler
  #    Secrets GEMINI_API_KEY and REFACTOR_PROMPT are injected via
  #    Cloud Build's --substitutions or Secret Manager bindings.
  # ------------------------------------------------------------------ #
  - name: "python:3.12-slim"
    id: llm-refactor
    entrypoint: python
    args:
      - "refactor_script.py"
      - "--source-dir"
      - "sample_project"
      - "--output-dir"
      - "output_dir"
    env:
      - "SOURCE_DIR=sample_project"
      - "OUTPUT_DIR=output_dir"
    secretEnv:
      - "GEMINI_API_KEY"
      - "PROMPT"
    waitFor:
      - install-deps

  # ------------------------------------------------------------------ #
  # 3. Artifact Validation — syntax check on generated files
  # ------------------------------------------------------------------ #
  - name: "python:3.12-slim"
    id: validate-artifacts
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install --quiet flake8 && \
        flake8 output_dir/ --max-line-length=120 --extend-ignore=E501,W503
    waitFor:
      - llm-refactor

  # ------------------------------------------------------------------ #
  # 4. Build the container image from optimised artefacts
  # ------------------------------------------------------------------ #
  - name: "gcr.io/cloud-builders/docker"
    id: docker-build
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/tcc-matrix:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/tcc-matrix:latest"
      - "-f"
      - "Dockerfile.optimized"
      - "."
    waitFor:
      - validate-artifacts

  # ------------------------------------------------------------------ #
  # 5. Push the container image to Container Registry
  # ------------------------------------------------------------------ #
  - name: "gcr.io/cloud-builders/docker"
    id: docker-push
    args:
      - "push"
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/tcc-matrix"
    waitFor:
      - docker-build

  # ------------------------------------------------------------------ #
  # 6. Deploy to Cloud Run
  # ------------------------------------------------------------------ #
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "tcc-matrix"
      - "--image"
      - "gcr.io/$PROJECT_ID/tcc-matrix:$SHORT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "2Gi"
      - "--cpu"
      - "2"
      - "--timeout"
      - "300"
    waitFor:
      - docker-push

# Expose secrets stored in Secret Manager to the build steps above.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: "GEMINI_API_KEY"
    - versionName: projects/$PROJECT_ID/secrets/REFACTOR_PROMPT/versions/latest
      env: "PROMPT"

images:
  - "gcr.io/$PROJECT_ID/tcc-matrix:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/tcc-matrix:latest"

options:
  logging: CLOUD_LOGGING_ONLY
