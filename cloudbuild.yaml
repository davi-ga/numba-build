# User-configurable substitutions.
# Override at trigger time:
#   gcloud builds submit --substitutions=_SOURCE_DIR=my_app,_OUTPUT_DIR=dist
# Or set defaults in the Cloud Build trigger configuration in the GCP Console.
substitutions:
  _SOURCE_DIR: sample_project
  _OUTPUT_DIR: output_dir

steps:
  # ------------------------------------------------------------------ #
  # 1. Install numba-build and its build dependencies
  # ------------------------------------------------------------------ #
  - name: "python:3.12-slim"
    id: install-deps
    entrypoint: pip
    args:
      - "install"
      - "--no-cache-dir"
      - ".[build]"

  # ------------------------------------------------------------------ #
  # 2. LLM Inference Step — run the intelligent compiler
  #    Secrets GEMINI_API_KEY, REFACTOR_PROMPT and MODEL_NAME are injected
  #    via Cloud Build's Secret Manager bindings.
  # ------------------------------------------------------------------ #
  - name: "python:3.12-slim"
    id: llm-refactor
    entrypoint: numba-build
    args:
      - "--source-dir"
      - "$_SOURCE_DIR"
      - "--output-dir"
      - "$_OUTPUT_DIR"
    secretEnv:
      - "GEMINI_API_KEY"
      - "PROMPT"
    waitFor:
      - install-deps

  # ------------------------------------------------------------------ #
  # 3. Artifact Validation — syntax check on generated files
  # ------------------------------------------------------------------ #
  - name: "python:3.12-slim"
    id: validate-artifacts
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install --quiet flake8 && \
        flake8 $_OUTPUT_DIR/ --max-line-length=120 --extend-ignore=E501,W503
    waitFor:
      - llm-refactor

  # ------------------------------------------------------------------ #
  # 4. Build the container image from optimised artefacts
  # ------------------------------------------------------------------ #
  - name: "gcr.io/cloud-builders/docker"
    id: docker-build
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/tcc-matrix:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/tcc-matrix:latest"
      - "-f"
      - "Dockerfile.optimized"
      - "."
    waitFor:
      - validate-artifacts

  # ------------------------------------------------------------------ #
  # 5. Push the container image to Container Registry
  # ------------------------------------------------------------------ #
  - name: "gcr.io/cloud-builders/docker"
    id: docker-push
    args:
      - "push"
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/tcc-matrix"
    waitFor:
      - docker-build

  # ------------------------------------------------------------------ #
  # 6. Deploy to Cloud Run
  # ------------------------------------------------------------------ #
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "tcc-matrix"
      - "--image"
      - "gcr.io/$PROJECT_ID/tcc-matrix:$SHORT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "2Gi"
      - "--cpu"
      - "2"
      - "--timeout"
      - "300"
    waitFor:
      - docker-push

# Expose secrets stored in Secret Manager to the build steps above.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: "GEMINI_API_KEY"
    - versionName: projects/$PROJECT_ID/secrets/REFACTOR_PROMPT/versions/latest
      env: "PROMPT"
images:
  - "gcr.io/$PROJECT_ID/tcc-matrix:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/tcc-matrix:latest"

options:
  logging: CLOUD_LOGGING_ONLY
